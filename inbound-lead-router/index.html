<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Inbound Lead Router</title>
<meta name="description" content="An n8n workflow that scores inbound leads with AI, logs them in HubSpot, and sends the team a ready-to-review first email for the best fits.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Palette: Rose quartz evening (same as the lead prospecting case study) */
  :root {
    --wine: #64242f;
    --brick: #b44446;
    --rose: #fc8f8f;
    --quartz: #dfd9d8;

    --bg: #faf6f5;
    --surface: #ffffff;
    --ink: #2b1a1d;
    --muted: #6f5d60;
    --line: #ebe3e2;
    --accent-soft: #fdeaea;
    --nav-h: 56px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    overflow-x: clip;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top bar ---------- */
  .topnav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(250, 246, 245, 0.82);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(235, 227, 226, 0.7);
  }
  .topnav-inner {
    max-width: 1040px;
    margin: 0 auto;
    height: var(--nav-h);
    display: flex;
    align-items: center;
    padding: 0 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    white-space: nowrap;
  }
  .brand img { height: 16px; width: auto; display: block; }
  .brand .sep { width: 1px; height: 12px; background: var(--quartz); }

  .article {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 20px 120px;
  }

  /* ---------- Header ---------- */
  .header { text-align: center; }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(30px, 4.6vw, 42px);
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--wine);
    margin: 0 auto 20px;
    text-wrap: balance;
  }
  h1::after {
    content: "";
    display: block;
    width: 40px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--brick), var(--rose));
    margin: 18px auto 0;
  }
  .lede {
    font-size: 18px;
    color: var(--muted);
    max-width: 620px;
    margin: 0 auto;
    text-wrap: pretty;
  }

  /* Built with */
  .built {
    margin: 32px auto 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }
  .built .label {
    width: 100%;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--brick);
    margin-bottom: 4px;
  }
  .built .chip {
    font-size: 14px;
    font-weight: 500;
    color: var(--wine);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
  }

  /* ---------- Flow ---------- */
  section { margin-top: 64px; }
  h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(23px, 3.4vw, 28px);
    line-height: 1.25;
    text-align: center;
    color: var(--wine);
    margin: 0 0 24px;
  }
  .flow {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px 0;
  }
  .flow li {
    display: flex;
    align-items: center;
    font-size: 14px;
    font-weight: 500;
  }
  .flow li span {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    white-space: nowrap;
  }
  .flow li:not(:last-child)::after {
    content: "→";
    color: var(--brick);
    margin: 0 8px;
    font-weight: 600;
  }
  .flow li.fit span {
    background: var(--accent-soft);
    border-color: #f6cfcf;
    color: var(--wine);
  }
  .flow li:last-child span {
    background: var(--wine);
    border-color: var(--wine);
    color: #fff;
  }
  .flow-note {
    text-align: center;
    font-size: 13.5px;
    color: var(--muted);
    margin: 14px 0 0;
  }

  /* ---------- Summary + video ---------- */
  .summary {
    font-family: "Fraunces", Georgia, serif;
    font-size: 22px;
    line-height: 1.45;
    text-align: center;
    color: var(--brick);
    margin: 56px auto 32px;
    max-width: 600px;
    text-wrap: balance;
  }
  .summary::before, .summary::after {
    content: "";
    display: block;
    width: 64px;
    height: 1px;
    background: var(--quartz);
    margin: 0 auto 18px;
  }
  .summary::after { margin: 18px auto 0; }

  .wide {
    margin-top: 48px !important;
    position: relative;
    width: min(1040px, calc(100vw - 32px));
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
  }
  .player {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 22px 50px -28px rgba(43, 26, 29, 0.5);
  }
  .player .chrome {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px 14px;
    background: #f4efee;
    border-bottom: 1px solid var(--line);
  }
  .player .chrome .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--quartz); }
  .player .chrome .title {
    margin-left: 12px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .player video {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    background: #111;
  }
  .chapters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
  }
  .chapters button {
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .chapters button b { color: var(--brick); font-weight: 600; margin-right: 4px; font-variant-numeric: tabular-nums; }
  .chapters button:hover { background: var(--accent-soft); border-color: #f6cfcf; }
  .wide figcaption {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    margin-top: 12px;
  }

  /* Illustrated button back to the about page:
     grey and white with the laptop closed; black and white with it open on hover */
  .home-btn {
    --hb-dark: #9a9a9a;
    --hb-teal: #d9d9d9;
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 60;
    display: grid;
    place-items: center;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid #e6e6e6;
    box-shadow: 0 8px 22px -10px rgba(0, 0, 0, 0.35);
    transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1), border-color 0.35s, box-shadow 0.35s;
  }
  .home-btn svg { width: 74%; height: auto; display: block; margin-top: 4%; }
  .home-btn .hb-dark { fill: var(--hb-dark); transition: fill 0.35s ease; }
  .home-btn .hb-teal { fill: var(--hb-teal); transition: fill 0.35s ease; }
  .home-btn .hb-open { opacity: 0; transition: opacity 0.35s ease; }
  .home-btn .hb-closed { transition: opacity 0.35s ease; }
  .home-btn:hover, .home-btn:focus-visible {
    --hb-dark: #111111;
    --hb-teal: #4d4d4d;
    transform: scale(1.08);
    border-color: #111;
    box-shadow: 0 10px 26px -10px rgba(0, 0, 0, 0.5);
  }
  .home-btn:hover .hb-open, .home-btn:focus-visible .hb-open { opacity: 1; }
  .home-btn:hover .hb-closed, .home-btn:focus-visible .hb-closed { opacity: 0; }
  .home-btn:focus-visible { outline: 2px solid #111; outline-offset: 4px; }
  .home-btn-tip {
    position: absolute;
    left: calc(100% + 12px);
    top: 50%;
    transform: translate(-6px, -50%);
    padding: 6px 12px;
    border-radius: 999px;
    background: #111;
    color: #fff;
    font-size: 12.5px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
  }
  .home-btn:hover .home-btn-tip,
  .home-btn:focus-visible .home-btn-tip { opacity: 1; transform: translate(0, -50%); }

  @media (max-width: 560px) {
    body { font-size: 16px; }
    .article { padding: 40px 16px 110px; }
    .topnav-inner { padding: 0 12px; }
    .summary { font-size: 19px; }
    .flow li { font-size: 13px; }
    .home-btn { left: 14px; bottom: 14px; width: 66px; height: 66px; }
  }
</style>
</head>
